<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CWJ Monitoring SDK Preview</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .btn {
      background: #0070f3;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 8px;
    }

    .btn:hover {
      background: #0051a2;
    }

    .btn-error {
      background: #e00;
    }

    .btn-error:hover {
      background: #c00;
    }

    code {
      background: #f5f5f5;
      padding: 2px 4px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <h1>CWJ Monitoring SDK Preview</h1>

  <div class="card">
    <h2>🚀 SDK Status</h2>
    <p>Status: <span id="status">Initializing...</span></p>
    <p>Check the <code>Network</code> tab to see events being sent.</p>
  </div>

  <div class="card">
    <h2>❌ Error Tracking</h2>
    <button class="btn btn-error" id="js-error">Trigger JS Error</button>
    <button class="btn btn-error" id="promise-error">Trigger Promise Rejection</button>
    <button class="btn btn-error" id="resource-error">Trigger Resource Error</button>
  </div>

  <div class="card">
    <h2>🖱️ Behavior Tracking</h2>
    <button class="btn" id="click-btn">Track Click</button>
    <input type="text" placeholder="Type something..." style="padding: 8px;">
  </div>

  <div class="card">
    <h2>🌐 Network Tracking</h2>
    <button class="btn" id="xhr-success">XHR Success</button>
    <button class="btn btn-error" id="xhr-error">XHR Error (404)</button>
    <button class="btn" id="fetch-success">Fetch Success</button>
    <button class="btn btn-error" id="fetch-error">Fetch Error (404)</button>
    <button class="btn btn-error" id="fetch-net-error">Fetch Network Error</button>
  </div>

  <div class="card">
    <h2>🛣️ Route Tracking</h2>
    <button class="btn" onclick="history.pushState({}, '', '/page-a')">Go to Page A</button>
    <button class="btn" onclick="history.pushState({}, '', '/page-b')">Go to Page B</button>
  </div>

  <script type="module">
    import { init, ErrorPlugin, BehaviorPlugin, PerformancePlugin, PVPlugin, XHRPlugin, FetchPlugin } from "./dist/index.js";

    try {
      init({
        url: "http://127.0.0.1:9000/collect",
        globalKey: '$monitor',
        plugin: [
          ErrorPlugin,
          BehaviorPlugin,
          PerformancePlugin,
          PVPlugin,
          XHRPlugin,
          FetchPlugin
        ],
        data: {
          env: 'preview',
          version: '1.0.0'
        },
        transport: {
          maxBatchSize: 5, // Send immediately for preview
          retry: true
        }
      });

      document.getElementById('status').textContent = '✅ Active (Global: window.$monitor)';
      console.log('SDK Initialized');
    } catch (e) {
      document.getElementById('status').textContent = '❌ Failed: ' + e.message;
      console.error(e);
    }

    // Error Triggers
    document.getElementById('js-error').addEventListener('click', () => {
      throw new Error('Test JS Error ' + Date.now());
    });

    document.getElementById('promise-error').addEventListener('click', () => {
      Promise.reject(new Error('Test Promise Rejection ' + Date.now()));
    });

    document.getElementById('resource-error').addEventListener('click', () => {
      const img = document.createElement('img');
      img.src = 'https://example.com/404.jpg';
      document.body.appendChild(img);
      setTimeout(() => img.remove(), 100);
    });

    // Network Triggers
    document.getElementById('xhr-success').addEventListener('click', () => {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://jsonplaceholder.typicode.com/todos/1');
      xhr.send();
    });

    document.getElementById('xhr-error').addEventListener('click', () => {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://jsonplaceholder.typicode.com/non-existent');
      xhr.send();
    });

    document.getElementById('fetch-success').addEventListener('click', () => {
      fetch('https://jsonplaceholder.typicode.com/todos/1');
    });

    document.getElementById('fetch-error').addEventListener('click', () => {
      fetch('https://jsonplaceholder.typicode.com/non-existent');
    });

    document.getElementById('fetch-net-error').addEventListener('click', () => {
      fetch('https://invalid-url-that-does-not-exist.com');
    });
  </script>
</body>

</html>
